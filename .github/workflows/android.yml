name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # comes with the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::Android SDK not found on runner"; exit 1; }

      - name: Build the web app and copy it into Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Write signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FASTTIME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::FASTTIME_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fasttime-release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          FASTTIME_KEYSTORE_PATH: ${{ runner.temp }}/fasttime-release.jks
          FASTTIME_KEYSTORE_PASSWORD: ${{ secrets.FASTTIME_KEYSTORE_PASSWORD }}
          FASTTIME_VERSION_CODE: ${{ github.run_number }}
          FASTTIME_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface compile errors as annotations so they show on the run summary.
            grep -E "error:|e: |FAILURE|What went wrong|AAPT|> " "$RUNNER_TEMP/gradle.log" | head -40 |
              while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit 1
          fi
          mv app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FastTime-1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: FastTime-android-1.${{ github.run_number }}
          path: FastTime-*.apk
          retention-days: 30
